{% extends 'base.html' %}{% block content %}<div class="card"><h1>New repair request</h1><form method="post"><label>Property<select name="property_id" required>{% for p in properties %}<option value="{{p.id}}">{{p.address}}</option>{% endfor %}</select></label><label>Title<input name="title" placeholder="Heating system not working" required></label><label>Description<textarea name="description" rows="6" required></textarea></label><div class="grid2"><label>Category<select name="category"><option>heating</option><option>plumbing</option><option>electrical</option><option>water</option><option>mold</option><option>security</option><option>general</option></select></label><label>Severity<select name="severity"><option value="standard">Standard</option><option value="urgent">Urgent</option><option value="emergency">Emergency</option></select></label></div><p class="warning">Severity does not itself establish a legal deadline. The configured jurisdiction ruleset controls workflow dates.</p><button class="button">Create repair case</button></form></div>{% endblock %}

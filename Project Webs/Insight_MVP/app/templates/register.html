{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>Create account</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Full name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option value="tenant">Tenant</option><option value="landlord">Landlord</option></select></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button">Create account</button></form></div>{% endblock %}
